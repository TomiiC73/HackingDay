<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandeja del administrador — HackerBank</title>
<style>
  body { background:#050507; color:#f5f5f7; font-family: ui-sans-serif, system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 28px 20px; }
  h1 { font-size: 1.4rem; }
  .meta { color:#8a8a92; font-size:.9rem; margin-bottom: 20px; }
  .msg { background: rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .from { color:#c9a84c; font-weight:700; }
  .empty { color:#8a8a92; }
</style>
</head>
<body>
  <h1>Mensajes al administrador</h1>
  <p class="meta">Usuario: <span id="nombre_usuario"></span> · Bandeja interna de soporte de HackerBank.</p>
  <script>
    // El nombre del usuario "dueño de este dispositivo" se toma de localStorage.
    // Se setea acá (antes de los mensajes) para que un payload que espere 'load'
    // ya lo encuentre disponible.
    document.getElementById("nombre_usuario").innerText =
      localStorage.getItem("hb_current_user") || "invitado";
  </script>

  <div id="mensajes">
    {% for m in messages %}
      <div class="msg">
        <span class="from">{{ m.from_username }}</span>
        <div class="body">{{ m.body | safe }}</div>   {# VULN-2: se renderiza SIN sanitizar (Stored XSS) #}
      </div>
    {% else %}
      <p class="empty">No hay mensajes todavía.</p>
    {% endfor %}
  </div>
</body>
</html>
