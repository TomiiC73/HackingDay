<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HackerBank</title>
<style>
  body { background:#050507; color:#f5f5f7; font-family: ui-sans-serif, system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 28px 20px; }
  a { color:#c9a84c; text-decoration:none; } a:hover { color:#fff; }
  h1 { font-size:1.4rem; margin-bottom:4px; }
  .sub { color:#8a8a92; margin-bottom:22px; font-size:.92rem; }
  .item { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
  .when { color:#8a8a92; font-size:.78rem; margin-bottom:6px; }
  .data { font-family: Consolas, ui-monospace, monospace; font-size:.82rem; word-break:break-all; color:#e8d38a; }
  .empty { color:#8a8a92; }
</style>
</head>
<body>
  <p><a href="{{ url_for('mensajes_page') }}">&larr; Volver a mensajes</a></p>
  <h1>Buzón de datos recibidos</h1>

  {% for it in items %}
    <div class="item">
      <div class="when">#{{ it.id }} · {{ it.created_at }}</div>
      <div class="data">{{ it.data }}</div>
    </div>
  {% else %}
    <p class="empty">Todavía no se recibió nada.</p>
  {% endfor %}

  <!-- Deja disponibles signChallenge() y hbForge() en la consola de esta página. -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
